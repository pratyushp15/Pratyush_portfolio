<svg width="360" height="360" viewBox="0 0 360 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Certified Fundamentals badge</title>
  <desc id="desc">A modern Microsoft Certified Fundamentals badge with a stylized four-pane flag and text.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="30" x2="310" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="80" x2="290" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="320" height="320" rx="42" fill="url(#bg)"/>
  <rect x="44" y="44" width="272" height="272" rx="32" stroke="rgba(255,255,255,0.15)"/>

  <g filter="url(#shadow)">
    <path d="M90 108L142 78L196 108V188L142 218L90 188V108Z" fill="url(#accent)" opacity="0.95"/>
    <path d="M142 78V218L196 188V108L142 78Z" fill="#1D4ED8" opacity="0.9"/>
    <path d="M90 108L142 138L196 108L142 78L90 108Z" fill="#EFF6FF" opacity="0.25"/>
    <path d="M90 188L142 218L196 188" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <g>
    <path d="M120 135H160V168H120V135ZM166 135H200V168H166V135ZM120 176H200V206H120V176Z" fill="#F8FAFC"/>
    <path d="M102 218H182C190.837 218 198 225.163 198 234V249H86V234C86 225.163 93.1634 218 102 218Z" fill="#0EA5E9" opacity="0.9"/>
    <path d="M202 218H256C264.837 218 272 225.163 272 234V249H190V234C190 225.163 197.163 218 206 218H202Z" fill="#10B981" opacity="0.9"/>
  </g>

  <g>
